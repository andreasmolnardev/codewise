services:
  app:
    image: subpolar/worker:1.0
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-test-password
    volumes:
      - subpolar-data:/var/lib/postgresql/data
volumes:
  subpolar-data: {}
