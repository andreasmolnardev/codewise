name: codewise

services:
  tailscale:
    image: tailscale/tailscale:v1.90.6
    hostname: codewise-${DEPLOYMENT_NAME:-node}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: codewise-${DEPLOYMENT_NAME:-node}
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY_FILE: /run/secrets/tailscale-authkey
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    secrets: [tailscale-authkey]
    networks: [docker-control, outbound]
    restart: unless-stopped

  codewise:
    image: ${CODEWISE_IMAGE:-ghcr.io/andreasmolnardev/codewise:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    network_mode: service:tailscale
    environment:
      SUBPOLAR_MANAGER_URL: ${SUBPOLAR_MANAGER_URL:-}
      SUBPOLAR_MANAGER_TOKEN: ${SUBPOLAR_MANAGER_TOKEN:-}
      SUBPOLAR_STORAGE_ROOT: ${SUBPOLAR_STORAGE_ROOT:-}
      SUBPOLAR_ACP_EXECUTION: ${SUBPOLAR_ACP_EXECUTION:-local}
      SUBPOLAR_ACP_WORKER_COMMAND: ${SUBPOLAR_ACP_WORKER_COMMAND:-}
      SUBPOLAR_MANAGED_PROVIDER_INSTANCE_IDS: ${SUBPOLAR_MANAGED_PROVIDER_INSTANCE_IDS:-}
    volumes:
      - codewise-state:/var/lib/codewise
      - codewise-workspaces:/workspaces
      - codex-home:/home/codewise/.codex
      - opencode-config:/home/codewise/.config/opencode
      - gh-config:/home/codewise/.config/gh
      - ssh-config:/home/codewise/.ssh
    depends_on:
      tailscale:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3773/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped

  docker-proxy:
    profiles: [docker]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-control]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:2375/_ping | grep -q OK"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  subpolar-manager:
    profiles: [subpolar]
    build:
      context: ..
      dockerfile: docker/subpolar-manager.Dockerfile
    environment:
      SUBPOLAR_MANAGER_HOST: 0.0.0.0
      SUBPOLAR_MANAGER_PORT: 8787
      SUBPOLAR_MANAGER_TOKEN: ${SUBPOLAR_MANAGER_TOKEN:-}
      SUBPOLAR_GATEWAY_STORAGE_ROOT: /workspaces
      SUBPOLAR_DOCKER_HOST_STORAGE_ROOT: ${SUBPOLAR_DOCKER_HOST_STORAGE_ROOT:-/var/lib/docker/volumes/codewise_codewise-workspaces/_data}
      SUBPOLAR_CONTAINER_STORAGE_ROOT: /workspaces
      SUBPOLAR_WORKER_IMAGE: ${SUBPOLAR_WORKER_IMAGE:-codewise-subpolar-worker:local}
      SUBPOLAR_DOCKER_SOCKET: /var/run/docker.sock
      SUBPOLAR_REGISTRATION_FILE: /var/lib/subpolar/environments.json
      SUBPOLAR_GATEWAY_GIT_ROOT: ${SUBPOLAR_GATEWAY_GIT_ROOT:-}
      SUBPOLAR_DOCKER_HOST_GIT_ROOT: ${SUBPOLAR_DOCKER_HOST_GIT_ROOT:-}
      SUBPOLAR_DEFAULT_DEVCONTAINER_CONFIG: ${SUBPOLAR_DEFAULT_DEVCONTAINER_CONFIG:-}
    volumes:
      - codewise-workspaces:/workspaces
      - ${SUBPOLAR_DOCKER_HOST_STORAGE_ROOT:-/var/lib/docker/volumes/codewise_codewise-workspaces/_data}:${SUBPOLAR_DOCKER_HOST_STORAGE_ROOT:-/var/lib/docker/volumes/codewise_codewise-workspaces/_data}:ro
      - subpolar-manager-state:/var/lib/subpolar
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    group_add:
      - ${SUBPOLAR_DOCKER_GID:-999}
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  docker-control:
    internal: true
  outbound: {}

volumes:
  codewise-state:
  codewise-workspaces:
    name: codewise_codewise-workspaces
  codex-home:
  opencode-config:
  gh-config:
  ssh-config:
  tailscale-state:
  subpolar-manager-state:

secrets:
  tailscale-authkey:
    file: ${TAILSCALE_AUTHKEY_FILE:-./secrets/tailscale-authkey}
