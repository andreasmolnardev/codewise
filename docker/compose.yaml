name: codewise

services:
  codewise:
    image: ${CODEWISE_IMAGE:-ghcr.io/andreasmolnardev/codewise:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    ports:
      - "127.0.0.1:3773:3773"
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - codewise-state:/var/lib/codewise
      - codewise-workspaces:/workspaces
      - codex-home:/home/codewise/.codex
      - opencode-config:/home/codewise/.config/opencode
      - gh-config:/home/codewise/.config/gh
      - ssh-config:/home/codewise/.ssh
    depends_on:
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3773/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      PING: 1
      VERSION: 1
      INFO: 1
      CONTAINERS: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-control]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:2375/_ping | grep -q OK"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  docker-control:
    internal: true

volumes:
  codewise-state:
  codewise-workspaces:
  codex-home:
  opencode-config:
  gh-config:
  ssh-config:
